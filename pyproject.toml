[project]
name = "tenantly"
version = "0.0.0"
description = "Address-level housing-law lookup compiled from statutes and ordinances."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "orjson>=3.10",
  "pydantic>=2.8",
  "jsonschema>=4.23",
  "typer>=0.12",
  "python-dateutil>=2.9",
  "shapely>=2.1.2",
  "anthropic>=1.11.0",
  "pypdf>=6.19.0",
  "textstat>=0.7.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
    "huggingface-hub>=2.1.1",
    "pyogrio>=0.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# user-facing EN/ES sentences are kept on one line each so they stay greppable
"engine/rules/templates.py" = ["E501"]
"engine/rules/explain.py" = ["E501"]
"engine/rules/render.py" = ["E501"]
"engine/rules/engine.py" = ["E501"]
"engine/compile/*.py" = ["E501"]
"engine/cli.py" = ["E501"]
"tests/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
