name: keepwarm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API so the free instance stays awake
        run: |
          if [ -n "${{ vars.API_BASE_URL }}" ]; then
            curl -fsS --max-time 60 "${{ vars.API_BASE_URL }}/v1/health" || true
          fi
